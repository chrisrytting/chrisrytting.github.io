{% comment %}
  Local override of the Alembic theme's site-footer.
  Pages can opt out of the footer bar with `hide_footer: true` in front matter.
{% endcomment %}
{% unless page.hide_footer %}
<footer class="footer">
  <div class="container">
    <div class="copyright  typeset">
      <small class="small">&copy; {{ site.title }} {{ site.time | date: '%Y' }}</small>
    </div>

    {% include nav-footer.html %}
  </div>
</footer>
{% endunless %}
